name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPrintDirect-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publishes a GitHub release + refreshes version.json (used by the in-app updater)
      # only when the versionName in app/build.gradle.kts has no release yet.
      - name: Publish release and update version.json
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VNAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk SmartPrintDirect.apk
          SHA=$(sha256sum SmartPrintDirect.apk | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s)
          gh release create "$TAG" SmartPrintDirect.apk --title "SmartPrintDirect $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          VCODE="$VCODE" VNAME="$VNAME" SHA="$SHA" NOTES="$NOTES" REPO="$GITHUB_REPOSITORY" TAG="$TAG" python3 - <<'PY'
          import json, os
          data = {
              "versionCode": int(os.environ["VCODE"]),
              "versionName": os.environ["VNAME"],
              "changelog": os.environ["NOTES"],
              "apkUrl": f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/SmartPrintDirect.apk",
              "expectedSha256": os.environ["SHA"],
          }
          with open("version.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json for $TAG [skip ci]"
          git push origin HEAD:main
